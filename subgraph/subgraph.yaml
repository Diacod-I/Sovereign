specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AgentRegistry
    # Confirm this slug in Subgraph Studio when you create the subgraph.
    network: arc-testnet
    source:
      address: "0x5E20F2ffE4f7C1a27412D53ab5C248bfef921A75"
      abi: AgentRegistry
      startBlock: 61082151
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
      abis:
        - name: AgentRegistry
          file: ./abis/AgentRegistry.json
      eventHandlers:
        - event: AgentRegistered(string,indexed address,address,uint256,string,string,string,string)
          handler: handleAgentRegistered
        - event: AgentUpdated(string,address,uint256,string,string,string,string)
          handler: handleAgentUpdated
        - event: AgentActivated(string)
          handler: handleAgentActivated
        - event: AgentDeactivated(string)
          handler: handleAgentDeactivated
      file: ./src/mapping.ts
