specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AgentRegistry
    # Confirm this slug in Subgraph Studio when you create the subgraph.
    network: arc-testnet
    source:
      address: "0x5E20F2ffE4f7C1a27412D53ab5C248bfef921A75"
      abi: AgentRegistry
      startBlock: 61082151
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
      abis:
        - name: AgentRegistry
          file: ./abis/AgentRegistry.json
      eventHandlers:
        - event: AgentRegistered(string,indexed address,address,uint256,string,string,string,string)
          handler: handleAgentRegistered
        - event: AgentUpdated(string,address,uint256,string,string,string,string)
          handler: handleAgentUpdated
        - event: AgentActivated(string)
          handler: handleAgentActivated
        - event: AgentDeactivated(string)
          handler: handleAgentDeactivated
      file: ./src/mapping.ts

  # Receipts — what actually happened on each paid call. 
  - kind: ethereum
    name: Receipts
    network: arc-testnet
    source:
      address: "0xceC57a89d0333355cB2fE73fcBF7f4729e49D16e"  
      abi: Receipts
      startBlock: 61460832
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Receipt
        - Agent
        - AgentBuyer
      abis:
        - name: Receipts
          file: ./abis/Receipts.json
      eventHandlers:
        - event: ReceiptFiled(indexed uint256,string,indexed address,bytes32,uint256,uint32,bool,uint8,string,string,uint64)
          handler: handleReceiptFiled
      file: ./src/mapping.ts
